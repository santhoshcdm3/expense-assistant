<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Assistant - Oracle APEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">💰 Expense Assistant (Oracle APEX)</h1>
        <button onclick="resetPasscode()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1 rounded transition">Reset Passcode</button>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-gray-700 text-gray-200 p-3 rounded-lg max-w-lg">
                👋 Hello! Type your expense command below (e.g., <code class="bg-gray-800 px-1 py-0.5 rounded text-green-400">Add lunch 15.50 Food</code>).
            </div>
        </div>
    </div>

    <!-- Input Bar -->
    <div class="bg-gray-800 p-4 border-t border-gray-700">
        <form id="chat-form" onsubmit="handleUserSubmit(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Type your message or expense..." 
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-lg font-medium transition">Send</button>
        </form>
    </div>

    <script>
        const CORRECT_PASSCODE = "1234"; 
        let awaitingPasscode = false;

        function appendMessage(sender, text, isError = false) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `flex ${sender === 'You' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${sender === 'You' ? 'bg-indigo-600 text-white' : (isError ? 'bg-red-900 text-red-200' : 'bg-gray-800 text-gray-200')} p-3 rounded-lg max-w-lg shadow">
                    <strong>${sender}:</strong> ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function resetPasscode() {
            sessionStorage.removeItem("is_authenticated");
            appendMessage("System", "🔒 Passcode cleared. Your next command will require verification.");
        }

        async function handleUserSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage("You", text);
            inputField.value = "";

            const isAuthenticated = sessionStorage.getItem("is_authenticated") === "true";

            if (awaitingPasscode) {
                if (text === CORRECT_PASSCODE) {
                    sessionStorage.setItem("is_authenticated", "true");
                    awaitingPasscode = false;
                    appendMessage("System", "✅ Passcode correct! Processing your pending action...");
                } else {
                    appendMessage("System", "❌ Incorrect passcode. Please try again:", true);
                }
                return;
            }

            if (!isAuthenticated) {
                awaitingPasscode = true;
                appendMessage("System", "🔒 Please enter your passcode in the chat to unlock API actions:");
                return;
            }

            await processCommand(text);
        }

        async function processCommand(text) {
            const parts = text.split(" ");
            const cmd = parts[0].toLowerCase();

            if (cmd === "add" && parts.length >= 4) {
                const title = parts[1];
                const amount = parseFloat(parts[2]);
                const category = parts.slice(3).join(" ");

                try {
                    const response = await fetch('/api/add_exp/newexp', {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title, amount, category })
                    });

                    if (!response.ok) throw new Error(`Server returned ${response.status}`);
                    const result = await response.json();
                    appendMessage("Assistant", `✅ Expense added to Oracle APEX! (${title} - $${amount})`);
                } catch (err) {
                    appendMessage("Assistant", `⚠️ Error calling API: ${err.message}`, true);
                }
            } else if (cmd === "list" || cmd === "all") {
                try {
                    const response = await fetch('/api/gt/expenses', { method: "GET" });
                    if (!response.ok) throw new Error(`Server returned ${response.status}`);
                    const data = await response.json();
                    appendMessage("Assistant", `📋 Expenses retrieved: ${JSON.stringify(data)}`);
                } catch (err) {
                    appendMessage("Assistant", `⚠️ Error fetching expenses: ${err.message}`, true);
                }
            } else {
                appendMessage("Assistant", "💡 Available commands:\n• `Add [Title] [Amount] [Category]`\n• `list` (Get all expenses)");
            }
        }
    </script>
</body>
</html>
