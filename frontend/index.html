<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Assistant with Tamil Voice Input</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-800">Expense Assistant</h1>
            <!-- Voice Input Button -->
            <button type="button" id="micBtn" onclick="toggleVoiceRecognition()" class="bg-red-600 text-white px-4 py-2 rounded-full shadow hover:bg-red-700 flex items-center space-x-2">
                <span>🎙️ Speak (Tamil)</span>
            </button>
        </div>
        
        <div id="voiceStatus" class="text-sm text-gray-600 italic"></div>

        <!-- Add Expense Form -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Add New Expense</h2>
            <form id="expenseForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="title" placeholder="Title" required class="border p-2 rounded">
                <input type="number" step="0.01" id="amount" placeholder="Amount" required class="border p-2 rounded">
                <input type="text" id="category" placeholder="Category" required class="border p-2 rounded">
                <input type="date" id="expense_date" required class="border p-2 rounded">
                <button type="submit" class="md:col-span-4 bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add Expense</button>
            </form>
        </div>

        <!-- Filter & Fetch Section -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Filter Expenses</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Single Date</label>
                    <input type="date" id="filterSingleDate" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Start Date (Range)</label>
                    <input type="date" id="filterStartDate" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">End Date (Range)</label>
                    <input type="date" id="filterEndDate" class="border p-2 rounded w-full">
                </div>
            </div>
            <button onclick="fetchExpenses()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Fetch Details</button>
            <button onclick="resetFilters()" class="bg-gray-400 text-white px-4 py-2 rounded ml-2 hover:bg-gray-500">Reset</button>
        </div>

        <!-- Expense List -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Expense Records</h2>
            <div id="expenseList" class="space-y-2">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        // Set default date to today
        document.getElementById('expense_date').value = new Date().toISOString().split('T')[0];

        // --- Tamil Voice Recognition & Translation Logic ---
        let recognition;
        let isRecording = false;

        function toggleVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support voice recognition. Please use Google Chrome.");
                return;
            }

            if (isRecording) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN'; // Set language to Tamil (India)
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById("micBtn").innerText = "🛑 Stop Listening";
                document.getElementById("voiceStatus").innerText = "Listening in Tamil... (e.g., 'Tea ku 50 rupees kuduthen')";
            };

            recognition.onresult = async (event) => {
                const tamilText = event.results[0][0].transcript;
                document.getElementById("voiceStatus").innerText = `Tamil Heard: "${tamilText}". Translating...`;
                
                // Translate or parse Tamil input to English fields
                await parseAndTranslateTamilInput(tamilText);
            };

            recognition.onerror = (event) => {
                document.getElementById("voiceStatus").innerText = "Voice error: " + event.error;
                stopMicUI();
            };

            recognition.onend = () => {
                stopMicUI();
            };

            recognition.start();
        }

        function stopMicUI() {
            isRecording = false;
            document.getElementById("micBtn").innerText = "🎙️ Speak (Tamil)";
        }

        async function parseAndTranslateTamilInput(tamilText) {
            try {
                // Using MyMemory free translation API to translate Tamil speech to English
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(tamilText)}&langpair=ta|en`);
                const data = await response.json();
                const englishText = data.responseData.translatedText || tamilText;

                document.getElementById("voiceStatus").innerText = `Translated: "${englishText}"`;

                // Extract amount (look for numbers in the text)
                const numberMatch = englishText.match(/\d+(\.\d+)?/);
                if (numberMatch) {
                    document.getElementById("amount").value = numberMatch[0];
                }

                // Clean up title and assign category based on keywords
                let title = englishText.replace(/\d+/g, '').trim();
                document.getElementById("title").value = title || englishText;

                // Simple keyword-based category assignment
                let category = "General";
                const lower = englishText.toLowerCase();
                if (lower.includes("tea") || lower.includes("coffee") || lower.includes("food") || lower.includes("lunch") || lower.includes("dinner") || lower.includes("eat")) {
                    category = "Food & Drinks";
                } else if (lower.includes("petrol") || lower.includes("diesel") || lower.includes("auto") || lower.includes("bus") || lower.includes("train") || lower.includes("travel")) {
                    category = "Transport";
                } else if (lower.includes("movie") || lower.includes("game") || lower.includes("shop")) {
                    category = "Entertainment";
                }
                document.getElementById("category").value = category;

            } catch (err) {
                console.error("Translation error:", err);
                document.getElementById("title").value = tamilText;
            }
        }

        // --- Standard Form Submission & Fetching ---
        document.getElementById("expenseForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById("title").value,
                amount: parseFloat(document.getElementById("amount").value),
                category: document.getElementById("category").value,
                expense_date: document.getElementById("expense_date").value
            };

            const res = await fetch(`${API_URL}/expenses`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("Expense added successfully!");
                document.getElementById("expenseForm").reset();
                document.getElementById('expense_date').value = new Date().toISOString().split('T')[0];
                document.getElementById("voiceStatus").innerText = "";
                fetchExpenses();
            } else {
                alert("Failed to add expense.");
            }
        });

        async function fetchExpenses() {
            let url = `${API_URL}/expenses?`;
            const singleDate = document.getElementById("filterSingleDate").value;
            const startDate = document.getElementById("filterStartDate").value;
            const endDate = document.getElementById("filterEndDate").value;

            if (singleDate) {
                url += `single_date=${singleDate}`;
            } else {
                if (startDate) url += `start_date=${startDate}&`;
                if (endDate) url += `end_date=${endDate}`;
            }

            const res = await fetch(url);
            const data = await res.json();
            
            const container = document.getElementById("expenseList");
            container.innerHTML = "";

            if (!data.expenses || data.expenses.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No expenses found for the selected criteria.</p>`;
                return;
            }

            data.expenses.forEach(exp => {
                const div = document.createElement("div");
                div.className = "flex justify-between items-center border-b p-2";
                div.innerHTML = `
                    <div>
                        <span class="font-bold">${exp.title}</span> (<span class="text-blue-600">${exp.category}</span>) - <span class="text-gray-600">${exp.expense_date}</span>
                    </div>
                    <div class="text-red-600 font-semibold">₹${exp.amount.toFixed(2)}</div>
                `;
                container.appendChild(div);
            });
        }

        function resetFilters() {
            document.getElementById("filterSingleDate").value = "";
            document.getElementById("filterStartDate").value = "";
            document.getElementById("filterEndDate").value = "";
            fetchExpenses();
        }

        fetchExpenses();
    </script>
</body>
</html>
