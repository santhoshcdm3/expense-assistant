<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Assistant - Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
            background-color: #131314;
            color: #e3e3e3;
        }
        .gemini-gradient-text {
            background: linear-gradient(135deg, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gemini-pill {
            background-color: #1e1f20;
            border: 1px solid #2e2f31;
            transition: all 0.2s ease;
        }
        .gemini-pill:hover {
            background-color: #28292c;
            border-color: #444746;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #2e2f31;
            border-radius: 9999px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #444746;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden">

    <!-- Gemini Header -->
    <header class="px-6 py-4 flex justify-between items-center bg-[#131314] border-b border-[#1e1f20] shrink-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 shadow-md">
                <i class="fa-solid fa-sparkles text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-base font-semibold text-[#e3e3e3] flex items-center gap-2">
                    Expense Assistant
                    <span class="text-[11px] font-normal px-2 py-0.5 rounded-full bg-[#1e1f20] text-[#a8c7fa] border border-[#2e2f31]">Gemini 1.5</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div id="auth-status-badge" class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 bg-[#1e1f20] border border-[#2e2f31] text-[#e3e3e3]">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="status-text">Passcode Required</span>
            </div>
            <button onclick="resetPasscode()" title="Reset Passcode Authorization" class="p-2 rounded-full hover:bg-[#1e1f20] text-[#c4c7c5] hover:text-white transition">
                <i class="fa-solid fa-lock-open text-sm"></i>
            </button>
            <button onclick="clearChat()" title="Clear Chat" class="p-2 rounded-full hover:bg-[#1e1f20] text-[#c4c7c5] hover:text-white transition">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 min-h-0 max-w-4xl w-full mx-auto px-4 py-2 flex flex-col justify-between">
        
        <!-- Chat History -->
        <div id="chat-container" class="chat-scroll flex-1 overflow-y-auto space-y-6 py-4 pr-1">
            
            <!-- Gemini Welcome View -->
            <div id="welcome-card" class="space-y-6 pt-4">
                <div class="space-y-2">
                    <h2 class="text-3xl font-normal">
                        <span class="gemini-gradient-text font-bold">Hello, Santhosh</span>
                    </h2>
                    <p class="text-xl text-[#c4c7c5] font-light">Where would you like to track your expenses today?</p>
                </div>

                <!-- Feature Prompt Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <button onclick="sendQuickPrompt('show yesterday expense')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-[#a8c7fa] font-medium uppercase tracking-wider">Date Query</span>
                            <i class="fa-solid fa-calendar-day text-[#a8c7fa]"></i>
                        </div>
                        <p class="text-sm text-[#e3e3e3] group-hover:text-white">"Show yesterday expense"</p>
                    </button>

                    <button onclick="sendQuickPrompt('add Dinner 25.00 Food')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-[#6dd58c] font-medium uppercase tracking-wider">Record</span>
                            <i class="fa-solid fa-plus-circle text-[#6dd58c]"></i>
                        </div>
                        <p class="text-sm text-[#e3e3e3] group-hover:text-white">"add Dinner 25.00 Food"</p>
                    </button>

                    <button onclick="sendQuickPrompt('show today expense')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-[#fde293] font-medium uppercase tracking-wider">Today</span>
                            <i class="fa-solid fa-clock text-[#fde293]"></i>
                        </div>
                        <p class="text-sm text-[#e3e3e3] group-hover:text-white">"Show today expense"</p>
                    </button>

                    <button onclick="sendQuickPrompt('list')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-[#c5b4e3] font-medium uppercase tracking-wider">Analytics</span>
                            <i class="fa-solid fa-list-ul text-[#c5b4e3]"></i>
                        </div>
                        <p class="text-sm text-[#e3e3e3] group-hover:text-white">"list" (All Recent Expenses)</p>
                    </button>
                </div>
            </div>

        </div>

        <!-- Gemini Input Bar Container -->
        <div class="shrink-0 pb-4 pt-2">
            <form id="chat-form" onsubmit="handleUserSubmit(event)" class="bg-[#1e1f20] border border-[#2e2f31] focus-within:border-[#444746] rounded-full p-2 pl-6 flex items-center gap-3 shadow-xl transition">
                <input type="text" id="user-input" placeholder="Enter a prompt or command (e.g. show yesterday expense)..." autocomplete="off"
                    class="flex-1 bg-transparent text-sm text-[#e3e3e3] placeholder-[#8e918f] focus:outline-none">
                <button type="submit" class="w-10 h-10 rounded-full bg-[#a8c7fa] hover:bg-[#b8d2fb] text-[#040e1f] flex items-center justify-center font-medium transition shadow">
                    <i class="fa-solid fa-arrow-up text-base"></i>
                </button>
            </form>
            <p class="text-[11px] text-center text-[#8e918f] mt-2">Expense Assistant connected to Oracle APEX ORDS API • Passcode: 1234</p>
        </div>

    </main>

    <script>
        const CORRECT_PASSCODE = "1234";
        let awaitingPasscode = false;
        let pendingCommand = null;

        document.addEventListener("DOMContentLoaded", () => {
            updateAuthBadge();
        });

        function updateAuthBadge() {
            const isAuth = sessionStorage.getItem("is_authenticated") === "true";
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (isAuth) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                text.textContent = "Authenticated";
                text.className = "text-emerald-400";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
                text.textContent = "Passcode Required";
                text.className = "text-amber-400";
            }
        }

        function appendMessage(sender, text, type = "normal") {
            const container = document.getElementById("chat-container");
            const isUser = sender === 'You';
            const div = document.createElement("div");
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;

            let avatar = '<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-sparkles text-white text-xs"></i></div>';
            let bgStyle = "bg-[#1e1f20] border-[#2e2f31] text-[#e3e3e3]";

            if (isUser) {
                avatar = '';
                bgStyle = "bg-[#28292c] border-[#37393b] text-[#e3e3e3]";
            } else if (type === "error") {
                bgStyle = "bg-[#3c1e1e] border-[#5c2828] text-[#f8b4b4]";
            } else if (type === "system") {
                bgStyle = "bg-[#2b2519] border-[#4a3b20] text-[#fde293]";
            } else if (type === "success") {
                bgStyle = "bg-[#192b20] border-[#204a30] text-[#6dd58c]";
            }

            div.innerHTML = `
                <div class="flex items-start gap-3 max-w-2xl ${isUser ? 'flex-row-reverse' : ''}">
                    ${avatar}
                    <div class="${bgStyle} border px-4 py-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap">
                        ${text}
                    </div>
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            const container = document.getElementById("chat-container");
            container.innerHTML = `
                <div id="welcome-card" class="space-y-6 pt-4">
                    <div class="space-y-2">
                        <h2 class="text-3xl font-normal">
                            <span class="gemini-gradient-text font-bold">Hello, Santhosh</span>
                        </h2>
                        <p class="text-xl text-[#c4c7c5] font-light">Where would you like to track your expenses today?</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                        <button onclick="sendQuickPrompt('show yesterday expense')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-[#a8c7fa] font-medium uppercase tracking-wider">Date Query</span>
                                <i class="fa-solid fa-calendar-day text-[#a8c7fa]"></i>
                            </div>
                            <p class="text-sm text-[#e3e3e3] group-hover:text-white">"Show yesterday expense"</p>
                        </button>
                        <button onclick="sendQuickPrompt('add Dinner 25.00 Food')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-[#6dd58c] font-medium uppercase tracking-wider">Record</span>
                                <i class="fa-solid fa-plus-circle text-[#6dd58c]"></i>
                            </div>
                            <p class="text-sm text-[#e3e3e3] group-hover:text-white">"add Dinner 25.00 Food"</p>
                        </button>
                        <button onclick="sendQuickPrompt('show today expense')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-[#fde293] font-medium uppercase tracking-wider">Today</span>
                                <i class="fa-solid fa-clock text-[#fde293]"></i>
                            </div>
                            <p class="text-sm text-[#e3e3e3] group-hover:text-white">"Show today expense"</p>
                        </button>
                        <button onclick="sendQuickPrompt('list')" class="gemini-pill text-left p-4 rounded-2xl flex flex-col justify-between gap-3 group">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-[#c5b4e3] font-medium uppercase tracking-wider">Analytics</span>
                                <i class="fa-solid fa-list-ul text-[#c5b4e3]"></i>
                            </div>
                            <p class="text-sm text-[#e3e3e3] group-hover:text-white">"list" (All Recent Expenses)</p>
                        </button>
                    </div>
                </div>
            `;
        }

        function resetPasscode() {
            sessionStorage.removeItem("is_authenticated");
            awaitingPasscode = false;
            pendingCommand = null;
            updateAuthBadge();
            appendMessage("System", "🔒 Session security reset. Next API query will request passcode verification (1234).", "system");
        }

        function sendQuickPrompt(promptText) {
            document.getElementById("user-input").value = promptText;
            document.getElementById("chat-form").dispatchEvent(new Event('submit', { cancelable: true }));
        }

        function getFormattedDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() - offsetDays);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function callApexApi(endpoint, options = {}, timeoutMs = 15000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const response = await fetch(endpoint, {
                    ...options,
                    signal: controller.signal,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Oracle APEX returned status ${response.status} (${response.statusText})`);
                }

                return await response.json();
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    throw new Error('Server request timed out. Oracle APEX backend took too long to respond.');
                }
                throw err;
            }
        }

        async function handleUserSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById("user-input");
            const rawText = inputField.value.trim();
            if (!rawText) return;

            appendMessage("You", rawText);
            inputField.value = "";

            const isAuthenticated = sessionStorage.getItem("is_authenticated") === "true";

            // Passcode Verification Gate
            if (awaitingPasscode) {
                if (rawText === CORRECT_PASSCODE) {
                    sessionStorage.setItem("is_authenticated", "true");
                    awaitingPasscode = false;
                    updateAuthBadge();
                    appendMessage("System", "✅ Passcode verified! Resuming your request...", "success");
                    if (pendingCommand) {
                        const cmdToExec = pendingCommand;
                        pendingCommand = null;
                        await executeCommand(cmdToExec);
                    }
                } else {
                    appendMessage("System", "❌ Incorrect passcode. Please try again (Passcode: 1234):", "error");
                }
                return;
            }

            // Require Passcode
            if (!isAuthenticated) {
                awaitingPasscode = true;
                pendingCommand = rawText;
                appendMessage("System", "🔒 Passcode verification required. Please enter passcode (1234):", "system");
                return;
            }

            await executeCommand(rawText);
        }

        async function executeCommand(text) {
            const lowerText = text.toLowerCase();

            if (lowerText.includes("yesterday")) {
                const yesterdayStr = getFormattedDate(1);
                appendMessage("Assistant", `✨ Fetching yesterday's expense records (${yesterdayStr})...`);
                await fetchExpensesByDateRange(yesterdayStr, yesterdayStr);
            }
            else if (lowerText.includes("today")) {
                const todayStr = getFormattedDate(0);
                appendMessage("Assistant", `✨ Fetching today's expense records (${todayStr})...`);
                await fetchExpensesByDateRange(todayStr, todayStr);
            }
            else if (lowerText.startsWith("add")) {
                const parts = text.split(" ").filter(p => p.length > 0);
                if (parts.length < 4) {
                    appendMessage("Assistant", "💡 Format: `add [Title] [Amount] [Category]` (e.g., `add Coffee 4.50 Food`)", "error");
                    return;
                }
                const title = parts[1];
                const amount = parseFloat(parts[2]);
                const category = parts.slice(3).join(" ");

                if (isNaN(amount)) {
                    appendMessage("Assistant", "⚠️ Please specify a valid numeric amount.", "error");
                    return;
                }

                try {
                    const data = await callApexApi('/api/add_exp/newexp', {
                        method: 'POST',
                        body: JSON.stringify({ title, amount, category })
                    });
                    appendMessage("Assistant", `✅ Expense added successfully!\n\n• Title: ${title}\n• Amount: ₹${amount.toFixed(2)}\n• Category: ${category}`, "success");
                } catch (err) {
                    appendMessage("Assistant", `⚠️ ${err.message}`, "error");
                }
            }
            else if (lowerText.includes("list") || lowerText.includes("all") || lowerText.includes("show expenses")) {
                try {
                    const data = await callApexApi('/api/gt/expenses', { method: 'GET' });
                    formatAndRenderList("All Recorded Expenses", data);
                } catch (err) {
                    appendMessage("Assistant", `⚠️ ${err.message}`, "error");
                }
            }
            else if (lowerText.startsWith("filter")) {
                const parts = text.split(" ").filter(p => p.length > 0);
                if (parts.length < 3) {
                    appendMessage("Assistant", "💡 Format: `filter [YYYY-MM-DD] [YYYY-MM-DD]`", "error");
                    return;
                }
                await fetchExpensesByDateRange(parts[1], parts[2]);
            }
            else {
                appendMessage("Assistant", "💡 Command not recognized. Try asking:\n• `show yesterday expense`\n• `add Lunch 15.50 Food`\n• `list`\n• `filter 2026-11-01 2026-11-10`");
            }
        }

        async function fetchExpensesByDateRange(fromDate, toDate) {
            try {
                const data = await callApexApi(`/api/frmto/exp/dates?from=${fromDate}&to=${toDate}`, { method: 'GET' });
                formatAndRenderList(`Expenses (${fromDate} to ${toDate})`, data);
            } catch (err) {
                appendMessage("Assistant", `⚠️ ${err.message}`, "error");
            }
        }

        function formatAndRenderList(heading, data) {
            const items = data.items || (Array.isArray(data) ? data : []);
            if (Array.isArray(items) && items.length > 0) {
                let formattedList = `📊 **${heading}:**\n\n`;
                let total = 0;
                items.forEach((exp, idx) => {
                    const title = exp.title || exp.name || exp.description || 'Expense';
                    const amount = parseFloat(exp.amount || exp.cost || exp.price || 0);
                    const cat = exp.category || exp.type || 'General';
                    total += amount;
                    formattedList += `${idx + 1}. **${title}** — ₹${amount.toFixed(2)} (${cat})\n`;
                });
                formattedList += `\n💰 **Total Spending:** ₹${total.toFixed(2)}`;
                appendMessage("Assistant", formattedList);
            } else {
                appendMessage("Assistant", `📋 Response from APEX backend:\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``);
            }
        }
    </script>
</body>
</html>
